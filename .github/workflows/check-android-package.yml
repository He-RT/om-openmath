name: 检查已有 Android 正式包
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: 已签名 tauri-android-apk 的构建 run
        required: true
permissions:
  contents: read
  actions: read
jobs:
  installed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: tauri-android-apk
          path: release-assets
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: tauri-android-package-check
          path: build-check
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: 仅为测试 APK 补齐被 release R8 去掉的 Trace 类
        env:
          OPENMATH_ANDROID_KEYSTORE_BASE64: ${{ secrets.OPENMATH_ANDROID_KEYSTORE_BASE64 }}
          OPENMATH_ANDROID_KEY_PASSWORD: ${{ secrets.OPENMATH_ANDROID_KEY_PASSWORD }}
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          curl --fail --location --silent --show-error https://dl.google.com/dl/android/maven2/androidx/tracing/tracing/1.1.0/tracing-1.1.0.aar --output "$RUNNER_TEMP/tracing.aar"
          python3 - <<'PY'
          import base64,os,zipfile
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          os.umask(0o077)
          (temp/'openmath-release.p12').write_bytes(base64.b64decode(os.environ['OPENMATH_ANDROID_KEYSTORE_BASE64']))
          with zipfile.ZipFile(temp/'tracing.aar') as archive:
              (temp/'tracing.jar').write_bytes(archive.read('classes.jar'))
          (temp/'tracing-dex').mkdir()
          PY
          "$ANDROID_HOME/build-tools/35.0.0/d8" --release --min-api 24 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output "$RUNNER_TEMP/tracing-dex" "$RUNNER_TEMP/tracing.jar"
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile('build-check/instrumentation.apk') as original,zipfile.ZipFile(temp/'test-with-tracing.apk','w') as patched:
              names=set(original.namelist())
              for entry in original.infolist():
                  if not entry.filename.startswith('META-INF/'):
                      patched.writestr(entry,original.read(entry))
              index=2
              while f'classes{index}.dex' in names:index+=1
              patched.write(temp/'tracing-dex/classes.dex',f'classes{index}.dex')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$RUNNER_TEMP/test-with-tracing.apk" "$RUNNER_TEMP/test-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/openmath-release.p12" --ks-key-alias openmath --ks-pass env:OPENMATH_ANDROID_KEY_PASSWORD --out "$RUNNER_TEMP/openmath-test.apk" "$RUNNER_TEMP/test-aligned.apk"
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p package-evidence
            adb install release-assets/OpenMath_0.1.0-pre-alpha.5_android.apk
            adb logcat -c
            adb shell am start -W -n org.openmath.openmath/.MainActivity
            sleep 8
            adb logcat -d > package-evidence/startup-logcat.txt
            adb exec-out screencap -p > package-evidence/startup.png
            adb shell uiautomator dump /sdcard/openmath-window.xml
            adb pull /sdcard/openmath-window.xml package-evidence/window.xml
            adb shell pidof org.openmath.openmath > package-evidence/app-pid.txt
            test -s package-evidence/app-pid.txt
            adb install -t "$RUNNER_TEMP/openmath-test.apk"
            adb logcat -c
            adb shell am instrument -w org.openmath.openmath.test/androidx.test.runner.AndroidJUnitRunner | tee package-evidence/instrumentation.txt
            adb logcat -d > package-evidence/instrumentation-logcat.txt
            adb exec-out screencap -p > package-evidence/instrumentation-screen.png
            grep -q 'OK (1 test)' package-evidence/instrumentation.txt
            adb pull /sdcard/Android/data/org.openmath.openmath/files/package-smoke.json package-evidence/result.json
            adb pull /sdcard/Android/data/org.openmath.openmath/files/package-smoke.png package-evidence/window.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-existing-package-check
          path: package-evidence
