name: 检查已有 Android 正式包
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: 已签名 tauri-android-apk 的构建 run
        required: true
permissions:
  contents: read
  actions: read
jobs:
  installed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            app/scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: tauri-android-apk
          path: release-assets
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: 构建仅供 CI 的系统 Instrumentation APK
        env:
          OPENMATH_ANDROID_KEYSTORE_BASE64: ${{ secrets.OPENMATH_ANDROID_KEYSTORE_BASE64 }}
          OPENMATH_ANDROID_KEY_PASSWORD: ${{ secrets.OPENMATH_ANDROID_KEY_PASSWORD }}
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          bash scripts/android/build-instrumentation.sh
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p package-evidence
            adb install release-assets/OpenMath_0.1.0-pre-alpha.5_android.apk
            adb logcat -c
            adb shell am start -W -n org.openmath.openmath/.MainActivity
            sleep 8
            adb logcat -d > package-evidence/startup-logcat.txt
            adb exec-out screencap -p > package-evidence/startup.png
            adb shell pidof org.openmath.openmath > package-evidence/app-pid.txt
            test -s package-evidence/app-pid.txt
            adb install -t "$RUNNER_TEMP/openmath-test.apk"
            adb logcat -c
            adb shell am instrument -w org.openmath.openmath.test/org.openmath.openmath.test.PackageSmokeInstrumentation | tee package-evidence/instrumentation.txt
            adb logcat -d > package-evidence/instrumentation-logcat.txt
            adb exec-out screencap -p > package-evidence/instrumentation-screen.png
            grep -Fq 'INSTRUMENTATION_RESULT: openmath=passed' package-evidence/instrumentation.txt
            adb pull /sdcard/Android/data/org.openmath.openmath/files/package-smoke.json package-evidence/result.json
            adb pull /sdcard/Android/data/org.openmath.openmath/files/package-smoke.png package-evidence/window.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-existing-package-check
          path: package-evidence
