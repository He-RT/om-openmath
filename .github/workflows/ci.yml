name: CI

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'docs/plan/**'
      - 'docs/acceptance/**'
      - 'docs/README.md'
      - 'CODEX_HANDOFF.md'
  pull_request:
    paths-ignore:
      - 'docs/plan/**'
      - 'docs/acceptance/**'
      - 'docs/README.md'
      - 'CODEX_HANDOFF.md'
  workflow_dispatch:
    inputs:
      full_suite:
        description: '候选集中验收：完整原生回归及开发Web E2E'
        type: boolean
        default: false
      run_ios:
        description: '显式运行后续iOS回归（不阻塞本轮Mac/Web）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native_macos:
    uses: ./.github/workflows/macos-native.yml
    with:
      full_suite: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ios
    uses: ./.github/workflows/ios.yml

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Install matching WASM bindings generator
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix app
      - name: Install pinned Agent Core/AI production dependencies
        run: npm ci --prefix agent --omit=dev --ignore-scripts
      - name: Validate actual Pi canonical ACK and sequential hooks
        run: node --test agent/test/pi-runtime.test.mjs agent/test/bridge.test.mjs
      - name: Validate private Agent canonical protocol streams
        run: node --test agent/test/protocol.test.mjs
      - name: Validate actual single-turn Rust codec driving pinned Pi
        run: python3 scripts/test_single_turn_pi.py
      - name: Build frontend assets
        run: npm run build --prefix app
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Check generated kernel protocol
        run: |
          cargo test -p om-kernel export_bindings --locked
          git diff --exit-code app/src/kernel/generated
          test -z "$(git ls-files --others --exclude-standard app/src/kernel/generated)"
      - name: Check workspace contracts
        run: python3 -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tests -v
      - name: Build WASM core
        run: cargo build -p om-kernel --no-default-features --locked --target wasm32-unknown-unknown

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Install WASM toolchain
        run: |
          rustup show active-toolchain
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Development Web E2E (full suite)
        if: inputs.full_suite
        run: npm run test:e2e
      - name: Test production static notebook
        run: OPENMATH_PERFORMANCE=1 OPENMATH_E2E_PREVIEW=1 npm run test:e2e -- --workers=1
      - name: Independently check all original production WASM math results
        run: CARGO_PROFILE_TEST_OPT_LEVEL=2 cargo test -p om-cli --test corpus production_wasm_results_match_all_original_authority_rows --locked -- --ignored
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-failure-evidence
          path: app/test-results
          if-no-files-found: warn

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependencies
        run: cargo deny --locked check
