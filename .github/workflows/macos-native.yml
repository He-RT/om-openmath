name: macOS 原生宿主门禁
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: 显式选择 Xcode 27.0 和 macOS SDK 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          bash macos/Scripts/verify-env.sh
      - name: 安装固定 Rust 工具链
        run: rustup show active-toolchain
      - name: 校验原生协议和工程漂移
        run: |
          python3 scripts/native_contracts.py --check
          python3 macos/Scripts/generate-project.py --check
      - name: 实际 Release 静态库和 Swift App 链接
        run: |
          mkdir -p target/macos-ci-evidence
          bash macos/Scripts/build-native.sh > target/macos-ci-evidence/build.log 2>&1
      - name: Swift 实际 ABI 生命周期与 DTO 负例
        run: bash macos/Scripts/test-native-contracts.sh > target/macos-ci-evidence/contracts.log 2>&1
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
      - name: 自有媒体、回环 HTTP 与实际 I/O 中断
        run: bash macos/Scripts/test-fixtures.sh > target/macos-ci-evidence/fixtures.log 2>&1
      - name: SQLite 实际同步、根锁和初始化中断
        run: bash macos/Scripts/test-storage.sh > target/macos-ci-evidence/storage.log 2>&1
      - name: Rust 原计划与 SQLite 幂等事务/独立回读
        run: bash macos/Scripts/test-document-store.sh > target/macos-ci-evidence/document-store.log 2>&1
      - name: Blob 真实字节、引用与发布中断
        run: bash macos/Scripts/test-blobs.sh > target/macos-ci-evidence/blobs.log 2>&1
      - name: 冻结预览、引用与实际 SQLite 回执
        run: bash macos/Scripts/test-preview.sh > target/macos-ci-evidence/preview.log 2>&1
      - name: 原生编辑屏障、真实源码提交与原 ID 回执恢复
        run: bash macos/Scripts/test-commit-port.sh > target/macos-ci-evidence/commit-port.log 2>&1
      - name: 实际逆事务、重启回执及原生 UndoManager
        run: bash macos/Scripts/test-undo.sh > target/macos-ci-evidence/undo.log 2>&1
      - name: 最近200源码历史、固定项与实际载荷裁减
        run: bash macos/Scripts/test-history.sh > target/macos-ci-evidence/history.log 2>&1
      - name: 实际 CAS 检查点、同库 Blob 接纳与原回执恢复
        run: bash macos/Scripts/test-kernel-store.sh > target/macos-ci-evidence/kernel-store.log 2>&1
      - name: 主运行 C ABI、共享文档门与实际取消和接纳
        run: bash macos/Scripts/test-kernel-runtime.sh > target/macos-ci-evidence/kernel-runtime.log 2>&1
      - name: 不可变结果 C ABI、完整源码分块和迟到回复
        run: bash macos/Scripts/test-results.sh > target/macos-ci-evidence/results.log 2>&1
      - name: 原生文件快照、真实保存与进程中断回读
        run: bash macos/Scripts/test-saves.sh > target/macos-ci-evidence/saves.log 2>&1
      - name: 校验开发包签名和实际 ABI 符号
        run: |
          codesign --verify --deep --strict 'target/macos-native/Build/Products/Release/OpenMath Preview.app'
          nm -g 'target/macos-native/Build/Products/Release/OpenMath Preview.app/Contents/MacOS/OpenMathNative' > target/macos-ci-evidence/symbols.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native-development-evidence
          path: target/macos-ci-evidence/*
          if-no-files-found: error
