name: 补充 CLI 发行包
run-name: CLI ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 已发布版本的完整源码提交
        required: true
        default: 86da06206c1ce547921ff2fb6ada892c5b090b48
      version:
        description: CLI 版本
        required: true
        default: 0.1.0-pre-alpha.5
      platform:
        description: 仅重跑失败的平台，或构建两平台
        type: choice
        options: [all, macos_arm64, windows_x64]
        default: all

permissions:
  contents: read

concurrency:
  group: release-cli-${{ inputs.source_sha }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: macos_arm64
            target: aarch64-apple-darwin
            rustflags: ''
          - runner: windows-latest
            platform: windows_x64
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          ref: ${{ github.sha }}
          path: packaging
          sparse-checkout: |
            scripts
            .github/workflows
      - uses: actions/checkout@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          sparse-checkout: |
            crates
            app/src-tauri
            docs/design
            docs/reference
            licenses
      - uses: actions/setup-python@v5
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          python-version: '3.13'
      - name: 构建现有 CLI
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        working-directory: source
        shell: bash
        env:
          CLI_TARGET: ${{ matrix.target }}
          CARGO_TERM_COLOR: always
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          rustup target add "$CLI_TARGET"
          cargo build -p om-cli --release --locked --target "$CLI_TARGET"
      - name: 打包并运行解压后的版本与求根检查
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        shell: bash
        env:
          CLI_PLATFORM: ${{ matrix.platform }}
          CLI_VERSION: ${{ inputs.version }}
          CLI_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python packaging/scripts/package_cli.py --source source --platform "$CLI_PLATFORM" --version "$CLI_VERSION" --sha "$CLI_SOURCE_SHA" --output release-assets
      - name: 记录 CLI 资产的产品与打包来源
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        shell: bash
        env:
          CLI_PLATFORM: ${{ matrix.platform }}
          CLI_VERSION: ${{ inputs.version }}
          CLI_SOURCE_SHA: ${{ inputs.source_sha }}
          PACKAGING_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          SOURCE_PARAMETERS: '{"profile":"release","locked":true,"target":"${{ matrix.target }}","rustflags":"${{ matrix.rustflags }}"}'
        run: |
          python packaging/scripts/release.py sources record --source source --packaging packaging --scope cli --platform "$CLI_PLATFORM" --tag "v$CLI_VERSION" --product-sha "$CLI_SOURCE_SHA" --packaging-sha "$PACKAGING_SHA" --run-url "$SOURCE_RUN_URL" --parameters "$SOURCE_PARAMETERS" --validation 'Extracted ZIP: version and roots 2/3; no GUI or live model tests' --assets-root release-assets --asset "om-cli_${CLI_VERSION}_${CLI_PLATFORM}.zip" --output "source-records/cli-${CLI_PLATFORM}-sources.json"
      - uses: actions/upload-artifact@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          name: cli-sources-${{ matrix.platform }}
          path: source-records/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          name: cli-${{ matrix.platform }}
          path: release-assets/*.zip
          if-no-files-found: error
