name: iOS iPadOS supplement
on:
  workflow_dispatch:
    inputs:
      run_simulators:
        description: 'Requires explicit user simulator permission for this candidate'
        type: boolean
        default: false
      publish:
        description: 'Append new assets after permitted simulator checks pass'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  mobile:
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject publication without simulator validation
        if: inputs.publish && !inputs.run_simulators
        run: exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - name: Select pinned SDK
        run: |
          for ios_developer in /Applications/Xcode_27.0.app/Contents/Developer /Applications/Xcode.app/Contents/Developer; do
            if [ -d "$ios_developer" ] && [ "$(DEVELOPER_DIR="$ios_developer" xcodebuild -version | sed -n '1p')" = 'Xcode 27.0' ]; then
              echo "DEVELOPER_DIR=$ios_developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Xcode 27.0 is required'
          exit 1
      - name: Build both targets without starting a simulator
        run: bash ios/Scripts/build-candidate.sh
      - name: Verify generated resources
        run: git diff --exit-code ios
      - name: Permitted iPhone and iPad validation
        if: inputs.run_simulators
        env:
          OPENMATH_IOS_SIMULATOR_BUILD: target/ios-pre-alpha.5/simulator
          OPENMATH_IOS_TEST_WITHOUT_BUILDING: '1'
        run: |
          bash ios/Scripts/test-simulator.sh phone
          bash ios/Scripts/test-simulator.sh pad
      - name: Package unsigned development candidates
        run: bash ios/Scripts/package-candidate.sh target/ios-pre-alpha.5 target/ios-release-assets
      - name: Record sources
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VALIDATION: ${{ inputs.run_simulators && 'ARM64 unsigned device build; the packaged ad hoc signed simulator candidate passed iPhone and iPad XCTest/UI checks. No physical device or real-model coverage.' || 'ARM64 unsigned device and ad hoc signed simulator build-only. No simulator execution, install or real-model coverage.' }}
        run: |
          python3 scripts/release.py sources record --source . --packaging . --scope ios --platform ios_arm64 --tag v0.1.0-pre-alpha.5 --product-sha "$GITHUB_SHA" --packaging-sha "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --parameters '{"sdk":"27.0","device":"arm64 unsigned","simulator":"arm64 ad hoc"}' --validation "$SOURCE_VALIDATION" --assets-root target/ios-release-assets --asset OpenMath_0.1.0-pre-alpha.5_ios_device_arm64_unsigned.app.zip --asset OpenMath_0.1.0-pre-alpha.5_ios_simulator_arm64.app.zip --asset OpenMathKernel_0.1.0-pre-alpha.5.xcframework.zip --output target/ios-release-assets/ios-build-sources.json
          python3 scripts/release.py sources index --repo . --assets-root target/ios-release-assets --manifest target/ios-release-assets/ios-release-manifest.json --record target/ios-release-assets/ios-build-sources.json --output target/ios-release-assets/ios-release-sources-index.json
          python3 scripts/release.py sources verify --repo . --assets-root target/ios-release-assets --index target/ios-release-assets/ios-release-sources-index.json
      - name: Append assets without replacing existing names
        if: inputs.publish && inputs.run_simulators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0-pre-alpha.5 target/ios-release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: ios-pre-alpha-5-candidate
          path: |
            target/ios-release-assets/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-pre-alpha-5-checks
          path: target/ios-*.xcresult
          if-no-files-found: ignore
