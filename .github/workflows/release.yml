name: 构建 Mac 与 Web 发行包

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 同源 Mac/Web 版本
        required: true
        default: v0.1.0-pre-alpha.5

permissions:
  contents: read

concurrency:
  group: release-packages-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  OPENMATH_SOURCE_REVISION: ${{ github.sha }}
  SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/release.py verify --tag "$TAG"
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: rustup show active-toolchain
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci --prefix app
      - run: npm run build --prefix app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e -- e2e/performance.spec.ts --workers=1
        working-directory: app
        env:
          OPENMATH_E2E_PREVIEW: '1'
          OPENMATH_PERFORMANCE: '1'
      - name: 核对原53条生产WASM数学结果
        run: cargo test -p om-cli --test corpus production_wasm_results_match_all_original_authority_rows --locked -- --ignored
      - name: 打包静态网站
        run: |
          mkdir release-assets
          version="${TAG#v}"
          cd app/dist
          zip -qr "../../release-assets/OpenMath-web_${version}.zip" .
      - name: 记录 web 资产来源
        env:
          SOURCE_PARAMETERS: '{"build":"npm run build --prefix app","wasm_bindgen":"0.2.129"}'
        run: |
          python scripts/release.py sources record --source . --packaging . --scope app-web --platform web --tag "$TAG" --product-sha "$GITHUB_SHA" --packaging-sha "$GITHUB_SHA" --run-url "$SOURCE_RUN_URL" --parameters "$SOURCE_PARAMETERS" --validation 'Production Web E2E and independent original 53 WASM results; no live model rerun' --assets-root release-assets --asset "OpenMath-web_${TAG#v}.zip" --output source-records/app-web-web-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-web
          path: source-records/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: release-assets/*
          if-no-files-found: error

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 选择 Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
      - run: rustup show active-toolchain
      - run: npm ci --prefix app --ignore-scripts
      - run: npm ci --prefix agent --omit=dev --ignore-scripts
      - run: command -v gpg >/dev/null || brew install gnupg
      - run: bash macos/Scripts/package-native.sh release-assets
      - name: 记录 macos_arm64 资产来源
        env:
          SOURCE_PARAMETERS: '{"build":"macos/Scripts/package-native.sh","signing":"ad-hoc","xcode":"27.0"}'
        run: |
          python scripts/release.py sources record --source . --packaging . --scope app-web --platform macos_arm64 --tag "$TAG" --product-sha "$GITHUB_SHA" --packaging-sha "$GITHUB_SHA" --run-url "$SOURCE_RUN_URL" --parameters "$SOURCE_PARAMETERS" --validation 'Native package build and signing checks; local install acceptance recorded separately' --assets-root release-assets --asset "OpenMath_${TAG#v}_aarch64.dmg" --asset "OpenMath_${TAG#v}_macos_arm64.app.zip" --output source-records/app-web-macos_arm64-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-macos_arm64
          path: source-records/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-native
          path: release-assets/*
          if-no-files-found: error

  manifest:
    needs: [web, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - run: python scripts/release.py finalize --tag "$TAG" --root release-assets --sha "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          pattern: source-*
          path: release-assets
          merge-multiple: true
      - run: |
          python scripts/release.py sources index --repo . --assets-root release-assets --manifest release-assets/release-manifest.json --record release-assets/app-web-web-sources.json --record release-assets/app-web-macos_arm64-sources.json --output release-assets/release-sources.json
          python scripts/release.py sources verify --repo . --assets-root release-assets --index release-assets/release-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: complete-mac-web-release
          path: release-assets/*
          if-no-files-found: error
