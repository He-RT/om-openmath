[workspace]
members = ["crates/om-num"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 1
