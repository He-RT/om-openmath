[package]
name = "om-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared sessions and notebook kernel protocol"

[features]
default = []
external-host = []
native = ["om-llm/http","dep:toml","dep:directories","dep:keyring","dep:tokio-util"]

[dependencies]
om-core.workspace = true
om-num.workspace = true
om-eval.workspace = true
om-parse.workspace = true
om-format.workspace = true
om-solve.workspace = true
om-simplify.workspace = true
om-llm.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
thiserror.workspace = true
toml = {workspace=true,optional=true}
directories = {workspace=true,optional=true}
keyring = {workspace=true,optional=true}
tokio-util = {workspace=true,optional=true}

[lints]
workspace = true

[dev-dependencies]
reqwest.workspace = true
tokio.workspace = true
wiremock.workspace = true

[[example]]
name = "live_deepseek"
required-features = ["native"]
