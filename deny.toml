[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "Unmaintained-only proc-macro-error 1.0.4 in Tauri's Linux GTK/glib build macros; no upstream upgrade. See THIRD_PARTY_NOTICES.md." },
]

[licenses]
version = 2
confidence-threshold = 0.95
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

# Specific unmodified native transitive packages only; no global extra-license allowance.
exceptions = [
    { crate = "webpki-root-certs@1.0.9", allow = ["CDLA-Permissive-2.0"] },
    { crate = "cssparser@0.37.0", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros@0.7.1", allow = ["MPL-2.0"] },
    { crate = "dtoa-short@0.3.5", allow = ["MPL-2.0"] },
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
    { crate = "selectors@0.38.0", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "malachite" },
    { name = "rug" },
    { name = "gmp-mpfr-sys" },
    { name = "algebraics" },
    { name = "symbolica" },
    { name = "flint-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
