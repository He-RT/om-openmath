[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.95
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "malachite" },
    { name = "rug" },
    { name = "gmp-mpfr-sys" },
    { name = "algebraics" },
    { name = "symbolica" },
    { name = "flint-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
