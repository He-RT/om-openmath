ready_to_publish_rule = "R4D01-R4D07 passed plus R4D08 package/install verified; public readback follows publication"

acceptance_summary = "docs/acceptance/pre-alpha.4/delivery-summary.md"

# scope 2只使用下列8项delivery_check阻塞交付。原gate数组保留稳定ID/133条目作参考，不再全部必过；不把暂缓冒称passed。

[[delivery_check]]
id = "R4D01"
name = "Mac与Web构建启动"
mandatory = true
check_status = "passed"
platforms = ["mac-native", "web"]
reference_gate_ids = ["R4G01", "R4G02", "R4G03", "R4G06", "R4G19", "R4G20"]
acceptance = "实际Release原生Mac.app与生产Web/WASM可启动；Mac自包含资源/Node/Pi，无用户开发环境依赖；版本/源码身份可查。"

[[delivery_check]]
id = "R4D02"
name = "共享数学与文件兼容"
mandatory = true
check_status = "passed"
platforms = ["core", "mac-native", "web"]
reference_gate_ids = ["R4G04", "R4G05"]
acceptance = "原53独立数学期望不变，Mac与生产WASM实际运行；精确/高精度/科研代表用例、续行、Modern/Wolfram和.omnb v1往返不退化。"

[[delivery_check]]
id = "R4D03"
name = "编辑计算保存与重开"
mandatory = true
check_status = "passed"
platforms = ["mac-native", "web"]
reference_gate_ids = ["R4G07", "R4G08", "R4G09", "R4G19"]
acceptance = "真实新建/打开、中文输入、undo/redo、计算/停止、保存、退出重开；不丢草稿，不接纳旧回复，不更改系统输入法配置。"

[[delivery_check]]
id = "R4D04"
name = "结果与实际图形"
mandatory = true
check_status = "passed"
platforms = ["mac-native", "web"]
reference_gate_ids = ["R4G10", "R4G11", "R4G18", "R4G23"]
acceptance = "原生/浏览器实际结果、公式、Markdown、步骤与矩阵可读；真实2D与基础3D几何/相机和已有Web导出可用，未接通高级入口禁用；无主编辑WebView替代原生。"

[[delivery_check]]
id = "R4D05"
name = "基础模型与助手闭环"
mandatory = true
check_status = "passed"
platforms = ["mac-native", "web"]
reference_gate_ids = ["R4G13", "R4G14", "R4G15", "R4G17", "R4G20"]
acceptance = "Mac至少一个授权模型配置后可对话、读取/修改/运行/检查并停止；一条确定性实际Pi闭环和一条真实授权模型任务；Web已有模型入口保持可用并如实提示CORS限制，不要求新Web Pi或全协议/媒体。"

[[delivery_check]]
id = "R4D06"
name = "真实性能"
mandatory = true
check_status = "passed"
platforms = ["core", "mac-native", "web"]
reference_gate_ids = ["R4G12", "R4G22", "R4G23"]
acceptance = "Release原53逐条CLI<200ms、生产Web WASM<1000ms、Mac submit至MainActor接纳整次<1000ms；两端10KiB输入可见绘制p95≤50ms。测量保留正确性，不挑最快重试。常规相机目标60Hz，记录启动/首帧/内存并修复明显卡顿；极限压力后置。"

[[delivery_check]]
id = "R4D07"
name = "数据恢复与权限边界"
mandatory = true
check_status = "passed"
platforms = ["mac-native", "web"]
reference_gate_ids = ["R4G07", "R4G08", "R4G13"]
acceptance = "相关真实原子写入/恢复、未知效果原ID核对、取消后不重放；工具只在授权范围修改，密钥不进入Pi/普通数据库/日志/导出；已有有效回归复用，不新增故障排列组合。"

[[delivery_check]]
id = "R4D08"
package_install_verified = true
public_download_verified = true
name = "实际安装与公开交付"
mandatory = true
check_status = "passed"
platforms = ["mac-installed", "web"]
reference_gate_ids = ["R4G21", "R4G29", "R4G30", "R4G31", "R4G32"]
acceptance = "Mac DMG/app ZIP与Web ZIP同候选版本/source/hash，简明清单和中文运行/已知限制说明；实际安装及生产Web启动。用实际可用签名并如实标明公证/Gatekeeper情况，不因Developer ID材料等待阻塞实验性pre-alpha。公开tag/下载/字节与程序回读后才称已交付。"

