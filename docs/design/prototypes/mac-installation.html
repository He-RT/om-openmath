<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenMath · 安装与首次启动评审</title>
<style>
:root{color-scheme:light;--bg:#fafbf8;--chrome:#eff2eb;--side:#edf0e8;--text:#2c332a;--muted:#77816f;--line:#dae1d2;--field:#fff;--accent:#387944;--select:#e2ebdd;--error:#b7533c;--warning:#967326}
html[data-theme=dark]{color-scheme:dark;--bg:#20251e;--chrome:#293026;--side:#262f23;--text:#e4eddf;--muted:#a8b59d;--line:#414e38;--field:#252e21;--accent:#98c989;--select:#364c2c;--error:#e9a18c;--warning:#d2b778}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;height:100svh;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}button:hover{background:var(--select)}button:disabled{opacity:.45;cursor:default}.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}.primary:hover{background:var(--accent);filter:brightness(.95)}.quiet{border-color:transparent;background:transparent}.muted{color:var(--muted)}.small{font-size:11px}.error{color:var(--error)}.warning{color:var(--warning)}select,input{border:1px solid var(--line);border-radius:5px;background:var(--field);padding:4px 7px;min-width:0}input[type=checkbox]{accent-color:var(--accent)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}h1,h2,h3,p{margin:0}h1{font-size:34px;font-weight:620;letter-spacing:-1px}h2{font-size:22px;font-weight:580}h3{font-size:13px;font-weight:600}.titlebar{height:64px;display:flex;align-items:center;gap:14px;background:var(--chrome);padding:0 20px;border-bottom:1px solid var(--line)}.lights{display:flex;gap:7px}.lights i{width:11px;height:11px;border-radius:50%;background:#fe6257}.lights i:nth-child(2){background:#ffbe2b}.lights i:nth-child(3){background:#29c742}.title{flex:1;font-weight:600;min-width:0}.title small{display:block;font-size:10px;color:var(--muted);font-weight:400}.top-actions{display:flex;gap:8px;align-items:center}.review{min-height:36px;padding:5px 19px;display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}.review>span{flex:1}.review label{display:flex;gap:5px;align-items:center;white-space:nowrap}.review select{font-size:10px;padding:2px 6px}.workspace{height:calc(100svh - 125px);display:grid;grid-template-columns:196px minmax(0,1fr)}.nav{background:var(--side);border-right:1px solid var(--line);padding:27px 13px;overflow:auto}.brand{padding:0 9px 24px;font-size:16px;font-weight:600;display:flex;gap:9px;align-items:center}.brand span{font:23px Georgia;color:var(--accent)}.nav-label{color:var(--muted);font-size:10px;padding:0 10px;margin:12px 0 9px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:6px;margin:3px 0;font-size:12px}.nav button[aria-current=page]{color:var(--accent);background:var(--select);font-weight:600}.nav-note{padding:22px 10px;font-size:10px;color:var(--muted)}main{overflow:auto;min-width:0}.welcome{max-width:770px;padding:65px 52px 45px;margin:0 auto}.welcome-logo{font:64px Georgia;color:var(--accent);line-height:1;margin-bottom:21px}.welcome .lead{font-size:18px;margin:9px 0 23px}.welcome .description{color:var(--muted);font-size:13px;line-height:1.9;max-width:540px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:29px}.actions button{padding:8px 15px}.second-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.second-actions button{font-size:11px;color:var(--muted)}.environment{border-top:1px solid var(--line);margin-top:42px;padding-top:18px;display:flex;align-items:start;gap:11px}.environment p{font-size:11px;color:var(--muted);margin-top:4px}.environment .mark{font-size:17px;color:var(--accent)}.footnote{font-size:10px;color:var(--muted);margin-top:23px;line-height:1.8}.spinner{display:inline-block;width:13px;height:13px;border:1.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}.page{max-width:820px;margin:auto;padding:37px 47px 40px}.page .intro{font-size:12px;color:var(--muted);margin-top:6px;margin-bottom:29px}.row{display:grid;grid-template-columns:142px minmax(0,1fr);gap:17px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.row .label{color:var(--muted)}.row .value{overflow-wrap:anywhere}.code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px}.section{margin-top:29px}.section h3{margin-bottom:8px}.feedback{margin-top:17px;min-height:28px;font-size:12px;overflow-wrap:anywhere}.update-summary{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:19px 0;margin-top:24px}.update-summary h3{margin-bottom:7px}.update-summary p{color:var(--muted);font-size:12px}.button-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:19px}.caption{font-size:10px;color:var(--muted);margin-top:12px}.notebook-header{display:flex;gap:8px;align-items:center;margin-bottom:25px}.notebook-header h2{flex:1}.source{white-space:pre-wrap;overflow:auto;padding:17px 19px;background:var(--side);border-radius:7px;font:13px/1.9 ui-monospace,SFMono-Regular,monospace;min-height:150px}.empty-models{margin-top:25px;border-top:1px solid var(--line);padding-top:22px}.empty-models h3{font-size:15px;font-weight:550}.empty-models p{font-size:12px;color:var(--muted);margin-top:7px}.error-heading{color:var(--error);margin-bottom:9px}.error-body{margin-top:24px;border-left:2px solid var(--error);padding-left:13px;color:var(--muted);font-size:12px}.status{height:25px;padding:4px 18px;background:var(--chrome);border-top:1px solid var(--line);color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.enter{animation:enter .14s ease-out}.reduce *{animation:none!important;transition:none!important}dialog{padding:23px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;width:min(460px,calc(100vw - 35px))}dialog::backdrop{background:#10211340}dialog p{font-size:12px;color:var(--muted);margin-top:12px}dialog .button-row{justify-content:flex-end}.permission-list{font-size:12px;color:var(--muted);padding-left:18px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes enter{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){.workspace{grid-template-columns:164px minmax(0,1fr)}.welcome{padding:48px 30px}.page{padding:30px}.welcome h1{font-size:29px}.review{font-size:9px}.row{grid-template-columns:115px minmax(0,1fr);gap:12px}}
@media(max-width:620px){.workspace{grid-template-columns:126px minmax(0,1fr);height:calc(100svh - 139px)}.nav{padding:18px 7px}.nav button{font-size:10px;padding:8px}.brand{font-size:12px;padding:0 5px 15px;gap:5px}.nav-note{padding:20px 7px;font-size:9px}.welcome,.page{padding:30px 18px}.welcome h1{font-size:27px}.welcome .lead{font-size:15px}.welcome-logo{font-size:48px}.review{min-height:50px;flex-wrap:wrap;padding:3px 12px;gap:4px}.review>span{flex-basis:100%}.titlebar{padding:0 12px;gap:10px}.top-actions button{padding:4px 7px;font-size:10px}.title small{font-size:9px}.lights{gap:5px}.lights i{width:9px;height:9px}.row{grid-template-columns:1fr;gap:3px}.environment{margin-top:27px}.actions{gap:7px}.actions button{font-size:11px;padding:7px 10px}.top-actions .label{display:none}}
</style></head>
<body>
<header class="titlebar"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div><div class="title">OpenMath Preview<small>原生 Mac 安装与首次启动</small></div><div class="top-actions"><label class="small muted"><span class="label">外观 </span><select id="theme" aria-label="外观"><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="reopen-welcome">欢迎页</button></div></header>
<div class="review"><span>评审草案 · 状态均为演示 · 不安装、不签名、不检查真实更新</span><label>启动场景 <select id="startup-scenario"><option value="ready">正常</option><option value="dmg">从只读 DMG 运行</option><option value="old_os">系统不兼容</option><option value="storage">存储初始化失败</option><option value="agent">助手运行时不可用</option></select></label><label><input id="reduce" type="checkbox">减少动态效果</label></div>
<div class="workspace"><nav class="nav" aria-label="启动与安装导航"><div class="brand"><span aria-hidden="true">∑</span>OpenMath</div><div class="nav-label">开始使用</div><button data-view="welcome" aria-current="page">首次启动</button><button data-view="notebook">本地笔记本</button><button data-view="providers">配置助手</button><div class="nav-label" style="margin-top:24px">应用信息</div><button data-view="about">关于 OpenMath</button><button data-view="updates">检查更新</button><p class="nav-note">本地数学无需账号。<br>供应商重新配置。<br>不导入旧版数据。</p></nav><main id="main"></main></div>
<footer class="status" id="status" role="status">原生实现与安装门禁仍待完成；此页仅评审导航与状态。</footer>
<dialog id="notice-dialog" aria-labelledby="notice-title"><h2 id="notice-title"></h2><p id="notice-body"></p><div class="button-row"><button id="notice-close" class="primary">关闭</button></div></dialog>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='welcome',startup='ready',startupGeneration=0,bootstrapPending=false,updateState='idle',updateGeneration=0,updateScenario='available',currentVersion='下一版开发预览 · 版本待定',updatePageOpened=false,userReduce=false,opener=null;
const systemReduce=matchMedia('(prefers-reduced-motion: reduce)');
function status(s){$('status').textContent=s}
function notice(title,body){opener=document.activeElement;$('notice-title').textContent=title;$('notice-body').textContent=body;$('notice-dialog').showModal()}
function canCompute(){return !bootstrapPending&&['ready','agent'].includes(startup)}
function canConfigure(){return !bootstrapPending&&startup==='ready'}
function row(label,value){return `<div class="row"><span class="label">${label}</span><span class="value">${value}</span></div>`}
function welcome(){const errors={dmg:['请先复制到应用程序','当前演示为只读磁盘映像启动。复制应用后再打开，不初始化业务存储。'],old_os:['当前系统不兼容','原生首版面向 Apple Silicon / macOS 27+；此场景演示较旧系统。'],storage:['本地存储尚未就绪','当前演示为初始化失败。保留原件与草稿，不创建伪成功的空数据库。']};const error=errors[startup];return `<section class="welcome enter"><div class="welcome-logo" aria-hidden="true">∑</div><h1>OpenMath</h1><p class="lead">本地数学笔记本</p><p class="description">新建、求解与绘图可直接使用。<br>助手可在之后连接你的模型服务。</p><div class="actions"><button id="start-local" class="primary" ${!canCompute()?'disabled':''}>开始本地计算</button><button id="setup-agent" ${!canConfigure()?'disabled':''}>配置助手</button></div><div class="second-actions"><button id="open-file" class="quiet" ${!canCompute()?'disabled':''}>打开笔记本…</button><button id="view-example" class="quiet" ${!canCompute()?'disabled':''}>查看示例</button></div><div class="environment"><span class="mark" aria-hidden="true">${bootstrapPending?'◌':error?'!':'✓'}</span><div><h3 id="startup-title">${bootstrapPending?'<span class="spinner" aria-hidden="true"></span>正在检查包与存储…':error?esc(error[0]):startup==='agent'?'数学可用 · 助手暂不可用':'Apple Silicon · macOS 27+'}</h3><p id="startup-description">${bootstrapPending?'等待演示回执；动画不决定就绪。':error?esc(error[1]):startup==='agent'?'演示运行时不可用。手工笔记本继续工作，不从网上自动安装 Node。':'新数据目录与供应商配置独立；无需另装 Node、Rust 或开发工具。'}</p>${error?'<div class="button-row"><button id="retry-startup">重新检查（演示）</button><button id="startup-diagnostics">查看诊断</button></div>':''}</div></div><p class="footnote">本页无旧版迁移向导。普通 .omnb v1 文件由用户主动打开，源码不自动执行。<br>所有启动状态为评审样例，不代表原生应用已经运行。</p></section>`}
function notebook(){if(!canCompute())return errorPage();return `<section class="page enter"><div class="notebook-header"><h2>未命名笔记本</h2><span class="small muted">示例 · 未保存</span></div><p class="intro">本地功能可直接开始，模型配置留到需要时处理。</p><div class="source"># 新的数学单元格\nsolve(x^2-5*x+6=0,x)</div><div class="button-row"><button id="example-info">查看示例范围</button><button id="return-welcome" class="quiet">返回欢迎页</button></div><div class="empty-models"><h3>${startup==='agent'?'助手运行时不可用':'助手尚未配置'}</h3><p>${startup==='agent'?'本地数学仍可用。正式版提供脱敏诊断与独立重启助手。':'连接你的供应商和模型后使用助手；这里没有旧版账户。'}</p><button id="empty-configure" style="margin-top:13px" ${!canConfigure()?'disabled':''}>配置供应商</button></div><p class="caption">本页是静态源码示例，没有调用 CAS 或创建本机文件。</p></section>`}
function providers(){return `<section class="page enter"><h2>供应商</h2><p class="intro">使用新原生配置目录，重新添加要使用的连接。</p><div class="empty-models" style="margin-top:45px"><h3>还没有配置供应商</h3><p>选择服务模板、填写凭据，再纳入模型。探测与保存分别确认。</p><div class="button-row"><button id="add-provider" class="primary" ${!canConfigure()?'disabled':''}>添加供应商</button><button id="local-without-ai">先使用本地计算</button></div></div><p class="caption">不会扫描旧 TOML、旧钥匙串或聊天记录；本页只表示空态。</p></section>`}
function about(){return `<section class="page enter"><h2>关于 OpenMath</h2><p class="intro">实际包版本、内核与运行时来源在原生窗口中核对。</p>${row('应用版本',esc(currentVersion))}${row('通道','Preview · 与正式版独立')}${row('安装目标','Apple Silicon / macOS 27.0+')}${row('Bundle ID','<span class="code">org.openmath.OpenMath.Preview</span>')}${row('内核 / 桥接','共享 Rust CAS · 新 Mac ABI 待实现')}${row('Agent / Node','Pi 1.0.4 / Node 26.11.1 · 候选，未随包验证')}${row('数据目录','<span class="code">OpenMath/NativeMacPreview</span>')}${row('签名状态','<span class="warning">开发预览 · 未公证（示例）</span>')}<div class="button-row"><button id="about-update">检查更新</button><button id="show-licenses">查看许可证</button><button id="about-diagnostics">查看诊断范围</button></div><p class="caption">实际签名与公证由发行流程核验，界面文字不能作为通过证据。</p></section>`}
function updates(){const messages={idle:['手动检查更新','首版通过官方发行页下载完整安装包。'],checking:['正在检查…','等待演示版本与资产信息。'],available:['有新构建可用（示例）','与当前通道和架构相符；下载后由用户手动安装。'],up_to_date:['当前已是最新（示例）','只有完整成功核对后才能得出此结论。'],failed:['无法检查更新','演示网络失败。状态未知，当前应用保持可用。'],incompatible:['新构建不兼容（示例）','不符合当前系统/架构，不能使用此安装包。'],cancelled:['检查已取消','没有安装或替换任何应用。']};const [title,body]=messages[updateState];return `<section class="page enter"><h2>检查更新</h2><p class="intro">检查版本与手动安装分开，不在后台替换正在运行的应用。</p>${row('当前版本',esc(currentVersion))}${row('更新通道','Preview · 包含对应预发行')}${row('自动检查','默认关闭 · 正式版可显式开启每日检查')}<div class="button-row"><label class="small muted">评审结果 <select id="update-scenario"><option value="available" ${updateScenario==='available'?'selected':''}>有新版</option><option value="up_to_date" ${updateScenario==='up_to_date'?'selected':''}>已是最新</option><option value="failed" ${updateScenario==='failed'?'selected':''}>网络失败</option><option value="incompatible" ${updateScenario==='incompatible'?'selected':''}>不兼容</option></select></label><button id="check-update" class="primary" ${updateState==='checking'?'disabled':''}>${updateState==='checking'?'检查中…':'检查更新（演示）'}</button><button id="cancel-update" ${updateState!=='checking'?'disabled':''}>取消</button></div><div class="update-summary"><h3 id="update-title" class="${updateState==='failed'?'error':''}">${updateState==='checking'?'<span class="spinner" aria-hidden="true"></span>':''}${title}</h3><p>${body}</p>${updateState==='available'?'<div class="button-row"><button id="open-download">打开下载页（演示）</button></div>':''}<p id="download-notice" class="caption">${updatePageOpened?'下载页已打开（演示）；当前安装版本没有变化。':''}</p></div><p class="caption">此页不访问 GitHub、不下载软件、不写应用目录。真实实现拒绝把查询失败称“已是最新”。</p></section>`}
function errorPage(){return `<section class="page enter"><h2 class="error-heading">暂时不能进入笔记本</h2><p class="intro">启动状态尚未就绪；先处理具体原因。</p><div class="error-body">${startup==='old_os'?'目标要求 macOS 27+ 和 Apple Silicon。':startup==='dmg'?'请将应用从只读磁盘映像复制到固定位置。':'本地存储初始化未获成功回执。'}</div><div class="button-row"><button id="return-welcome">返回启动页</button><button id="startup-diagnostics">查看诊断</button></div></section>`}
function render(){document.querySelectorAll('[data-view]').forEach(n=>n.setAttribute('aria-current',n.dataset.view===view?'page':'false'));$('main').innerHTML=({welcome,notebook,providers,about,updates})[view]();bind()}
function go(next){view=next;render()}
function bind(){for(const id of ['return-welcome'])if($(id))$(id).onclick=()=>go('welcome');if($('start-local'))$('start-local').onclick=()=>{if(canCompute())go('notebook')};if($('setup-agent'))$('setup-agent').onclick=()=>{if(canConfigure())go('providers')};if($('empty-configure'))$('empty-configure').onclick=()=>go('providers');if($('local-without-ai'))$('local-without-ai').onclick=()=>go('notebook');if($('open-file'))$('open-file').onclick=()=>notice('打开笔记本','正式版打开系统文件选择器；这里只演示入口，不读取文件或自动运行。');if($('view-example'))$('view-example').onclick=()=>{go('notebook');status('已展示预设源码样例；没有运行单元格。')};if($('example-info'))$('example-info').onclick=()=>notice('源码示例','这里没有 CAS 请求。正式版加载样例源码后，由用户选择运行范围。');if($('add-provider'))$('add-provider').onclick=()=>notice('添加供应商','正式版进入已设计的供应商表单；新数据目录没有旧版配置，本页不提交密钥或请求。');if($('show-licenses'))$('show-licenses').onclick=()=>notice('随包许可','真实包需要 Rust、Pi、Node 和其第三方依赖、SwiftMath、Markdown 与字体许可；本页不伪造已打包报告。');for(const id of ['startup-diagnostics','about-diagnostics'])if($(id))$(id).onclick=()=>notice('诊断默认范围','应用版本、系统与架构、包/ABI检查、实际错误类别。不会自动复制源码、媒体、数据库或密钥。');if($('about-update'))$('about-update').onclick=()=>go('updates');if($('retry-startup'))$('retry-startup').onclick=recheckStartup;if($('update-scenario'))$('update-scenario').onchange=e=>{updateScenario=e.target.value};if($('check-update'))$('check-update').onclick=checkUpdate;if($('cancel-update'))$('cancel-update').onclick=()=>{updateGeneration++;updateState='cancelled';render();status('演示查询已取消，迟到回调无权改当前状态。')};if($('open-download'))$('open-download').onclick=()=>{updatePageOpened=true;render();status('仅演示打开官方发行页；当前安装版本未改变。')}}
function recheckStartup(){if(bootstrapPending)return;const token=++startupGeneration;bootstrapPending=true;render();setTimeout(()=>{if(token!==startupGeneration)return;bootstrapPending=false;render();status('演示重新检查后仍按场景显示，动画结束不创造启动成功。')},450)}
function checkUpdate(){if(updateState==='checking')return;const token=++updateGeneration,result=updateScenario;updateState='checking';updatePageOpened=false;render();setTimeout(()=>{if(token!==updateGeneration)return;updateState=result;if(view==='updates')render();status('演示版本查询结束；没有网络请求或安装操作。')},500)}
document.querySelectorAll('[data-view]').forEach(n=>n.onclick=()=>go(n.dataset.view));$('reopen-welcome').onclick=()=>go('welcome');$('startup-scenario').onchange=e=>{startupGeneration++;bootstrapPending=false;startup=e.target.value;go('welcome')};$('theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;$('notice-close').onclick=()=>$('notice-dialog').close();$('notice-dialog').addEventListener('close',()=>{if(opener?.isConnected)opener.focus();else $('reopen-welcome').focus()});
function updateMotion(){const reduce=systemReduce.matches||userReduce;document.body.classList.toggle('reduce',reduce);$('reduce').checked=reduce;$('reduce').disabled=systemReduce.matches}$('reduce').onchange=e=>{userReduce=e.target.checked;updateMotion()};systemReduce.addEventListener('change',updateMotion);updateMotion();render();
</script></body></html>
