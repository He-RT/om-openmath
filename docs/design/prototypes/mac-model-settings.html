<body>
<header class="titlebar">
 <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
 <div class="app-title">OpenMath 设置<span>供应商、模型与媒体</span></div>
 <div class="top-actions"><label class="small muted">外观 <select id="theme" aria-label="外观"><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="open-picker">助手中选择</button></div>
</header>
<div class="review"><span>交互评审草案 · 所有配置与测试均为示例 · 不调用模型、不保存真实密钥</span><label>评审场景 <select id="scenario"><option value="normal">正常</option><option value="save_error">保存失败</option><option value="save_unknown">保存结果未知</option><option value="probe_error">测试失败</option></select></label><label><input id="reduce" type="checkbox"> 减少动态效果</label></div>
<div class="workspace">
 <nav class="sidebar" aria-label="设置导航">
  <div class="brand"><span class="brand-icon" aria-hidden="true">∑</span>OpenMath</div>
  <div class="nav-label">设置</div>
  <div class="small muted" style="padding:4px 10px">通用</div><div class="small muted" style="padding:8px 10px">编辑与计算</div>
  <div class="nav-label">AI</div>
  <button class="nav" id="nav-providers" data-view="providers" aria-current="page"><span class="nav-icon" aria-hidden="true">◉</span>供应商</button>
  <button class="nav" id="nav-models" data-view="models"><span class="nav-icon" aria-hidden="true">◇</span>模型</button>
  <button class="nav" id="nav-routes" data-view="routes"><span class="nav-icon" aria-hidden="true">⇢</span>功能映射</button>
  <button class="nav" id="nav-media" data-view="media"><span class="nav-icon" aria-hidden="true">▧</span>媒体处理</button>

 </nav>
 <main class="main" id="main"></main>
</div>

<script>
const $=id=>document.getElementById(id), copy=x=>structuredClone(x), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const providers=[
 {id:'deepseek',name:'DeepSeek · 个人',template:'DeepSeek',protocol:'openai_chat',url:'https://api.deepseek.com',enabled:true,hasKey:true,revision:1,note:'目录已获取 · 尚未测试连接'},
 {id:'anthropic',name:'Anthropic · 工作',template:'Anthropic',protocol:'anthropic_messages',url:'https://api.anthropic.com',enabled:true,hasKey:false,revision:1,note:'需要配置凭据'},
 {id:'ollama',name:'本机 Ollama',template:'Ollama',protocol:'ollama_chat',url:'http://127.0.0.1:11434',enabled:true,hasKey:false,revision:1,note:'本地连接 · 尚未测试'}
];
for(const p of providers)p.modelDefaults={context:p.id==='deepseek'?1048576:null,modalities:{image:p.id==='deepseek'||p.id==='anthropic'?'supported':'unknown',pdf:p.id==='anthropic'?'supported':'unknown',audio:'unknown',video:'unknown'},reasoningMap:{none:'none',low:'low',medium:p.id==='deepseek'?'':'medium',high:'high',max:'max'}};
const models=[
 {id:'flash',provider:'deepseek',name:'DeepSeek-V4.1-Flash',api:'deepseek-flash',enabled:true,output:8192,effort:'high',temperature:'',tools:false,image:true,pdf:false,input:1048576,inputSource:'目录声明',preset:'默认',revision:1,note:'目录声明 · 工具待测试'},
 {id:'pro',provider:'deepseek',name:'DeepSeek-V4-Pro',api:'deepseek-v4-pro',enabled:true,output:8192,effort:'high',temperature:'',tools:false,image:false,pdf:false,input:1048576,inputSource:'目录声明',preset:'默认',revision:1,note:'目录声明 · 工具待测试'},
 {id:'local',provider:'ollama',name:'我的本地模型',api:'local-model:latest',enabled:true,output:4096,effort:'none',temperature:'0.2',tools:false,image:false,pdf:false,input:null,inputSource:'未知',preset:'默认',revision:1,note:'手工添加 · 能力未知'}
];
function inheritedOverrides(){return {context:{mode:'inherit',value:null},modalities:Object.fromEntries(['image','pdf','audio','video'].map(k=>[k,{mode:'inherit',value:null}])),reasoningMap:{mode:'inherit',value:null}}}
for(const m of models){m.catalogImage=m.image;m.overrides=inheritedOverrides();if(m.id==='pro')m.overrides.modalities.image={mode:'override',value:'unsupported'}}
let view='providers', selectedProvider='deepseek', selectedModel='flash', search='', narrowDetail=false, nextId=1, globalScenario='normal', requestSerial=0;
const drafts=new Map(), feedback=new Map(), jobs=new Map(), ephemeralKeys=new Map(), demoReceipts=new Map();
let routes={execute:'',discuss:'flash',translate:'flash',explain:'flash',fix:'flash',complete:''}, routeDraft=copy(routes);
let mediaSaved={policy:'native_first',transcription:'',pages:8,method:'pages'},mediaDraft=copy(mediaSaved),mediaGeneration=0,mediaResult=null;
let pickerMode='discuss', pickerSelection='flash', pickerPending='', pickerSearch='', pickerRunning=false;
let addStep=1,addDraft={template:'DeepSeek',name:'',url:'https://api.deepseek.com'}, addOpener=null;
const systemReduce=matchMedia('(prefers-reduced-motion: reduce)');let userReduce=false;
const protocolNames={openai_chat:'Chat Completions',openai_responses:'Responses',anthropic_messages:'Anthropic Messages',gemini_generate:'Gemini Generate',ollama_chat:'Ollama Chat'};
const status=(s)=>{$('bottom-note').textContent=s};
function sourceObject(kind,id){return(kind==='provider'?providers:models).find(x=>x.id===id)}
function key(kind,id){return kind+':'+id}
function draft(kind,id){const k=key(kind,id);if(!drafts.has(k))drafts.set(k,copy(sourceObject(kind,id)));return drafts.get(k)}
function signature(d){return JSON.stringify(d)}
function dirty(kind,id){return signature(draft(kind,id))!==signature(sourceObject(kind,id))}
function current(){return view==='providers'?['provider',selectedProvider]:['model',selectedModel]}
function updateDraft(kind,id,name,value){const d=draft(kind,id);if(kind==='model'&&['api','output','effort','temperature','overrides'].includes(name)&&signature(d[name])!==signature(value)){d.tools=false;d.note='参数组合已修改 · 工具需要重新测试'}d[name]=value;const f=feedback.get(key(kind,id));if(f?.testedHash&&f.testedHash!==signature(d))feedback.set(key(kind,id),{text:'草稿已修改，上次测试不适用于当前配置。',type:'warning'});updateFooter();updateFeedback(kind,id)}
function updateFeedback(kind,id){const f=feedback.get(key(kind,id));const node=$('object-feedback');if(node&&current().join(':')===key(kind,id)){node.className='feedback '+(f?.type||'muted');node.innerHTML=(f?.busy?'<span class="progress" aria-hidden="true"></span>':'')+esc(f?.text||'')};const probe=$('probe-object');if(probe)probe.disabled=jobs.has(key(kind,id))}
function objectFeedback(kind,id){const f=feedback.get(key(kind,id));return `<div id="object-feedback" class="feedback ${esc(f?.type||'muted')}" role="status">${f?.busy?'<span class="progress" aria-hidden="true"></span>':''}${esc(f?.text||'')}</div>`}
function objectFooter(kind,id){const j=jobs.get(key(kind,id)),isUnknown=j?.type==='unknown',busy=j?.type==='save';return `<div class="detail-footer"><span id="save-status" class="save-status">${isUnknown?'保存结果未知 · 请先核对':busy?'正在保存演示配置…':dirty(kind,id)?'未保存修改 · 当前生效配置保持原样':'当前显示已保存的示例配置'}</span><button id="restore-object" ${busy||isUnknown?'disabled':''}>还原草稿</button>${isUnknown?'<button id="reconcile-object" class="primary">核对保存状态</button>':`<button id="save-object" class="primary" ${busy||!dirty(kind,id)?'disabled':''}>${busy?'保存中…':'保存'}</button>`}</div>`}

$('model-picker').addEventListener('keydown',e=>{if(e.isComposing||e.target.tagName==='SELECT')return;if(['ArrowDown','ArrowUp'].includes(e.key)){const items=[...$('model-picker').querySelectorAll('[data-pick]:not(:disabled)')];if(!items.length)return;const index=items.indexOf(document.activeElement),next=e.key==='ArrowDown'?Math.min(items.length-1,index+1):index<0?items.length-1:Math.max(0,index-1);e.preventDefault();items[next].focus()}else if(e.key==='Enter'&&e.target.id==='picker-search'){const first=$('model-picker').querySelector('[data-pick]:not(:disabled)');if(first){e.preventDefault();first.click()}}});
function prepareMedia(){const n=Number($('media-pages').value),chosen=models.find(m=>m.id===(pickerPending||pickerSelection));if(!(n>=1&&n<=20)||$('media-method').value==='needs_choice'||$('media-method').value==='pages'&&!modelImage(chosen))return;const token=++mediaGeneration,method=$('media-method').value;$('media-feedback').innerHTML='<span class="progress" aria-hidden="true"></span>正在演示准备所选页…';setTimeout(()=>{if(token!==mediaGeneration||view!=='media')return;mediaResult=`已准备 ${n} 页${method==='pages'?'图片':'提取文字'}（示例），未包含 ${n+1}–36 页，尚未发送给模型。`;$('media-feedback').textContent=mediaResult},600)}
document.querySelectorAll('[data-view]').forEach(n=>n.onclick=()=>{view=n.dataset.view;search='';narrowDetail=false;++mediaGeneration;render()});$('scenario').onchange=e=>globalScenario=e.target.value;$('theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;$('open-picker').onclick=openPicker;
function updateMotion(){const reduce=systemReduce.matches||userReduce;document.body.classList.toggle('reduce',reduce);$('reduce').checked=reduce;$('reduce').disabled=systemReduce.matches}
$('reduce').onchange=e=>{userReduce=e.target.checked;updateMotion()};systemReduce.addEventListener('change',updateMotion);updateMotion();render();
window.addEventListener('beforeunload',()=>ephemeralKeys.clear());
</script>
</body>
